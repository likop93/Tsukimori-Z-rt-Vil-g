name: Build Windows Review

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "data/**"
      - "TESTER_README.txt"
      - ".github/workflows/windows-review-build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2 and export templates
        run: |
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          wget -q https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Import project
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import

      - name: Export Windows x86_64
        run: |
          mkdir -p build
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/Tsukimori_Review.exe

      - name: Prepare tester package
        run: |
          cp TESTER_README.txt build/TESTER_README.txt
          {
            echo "Tsukimori — Zárt Világ"
            echo "Review build"
            echo "Commit: $GITHUB_SHA"
            echo "Built: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "Godot: 4.7.2 stable"
          } > build/BUILD_INFO.txt
          cd build
          zip -9 ../Tsukimori_Review_Windows.zip Tsukimori_Review.exe TESTER_README.txt BUILD_INFO.txt

      - name: Upload Windows review build
        uses: actions/upload-artifact@v4
        with:
          name: Tsukimori-Review-Windows
          path: Tsukimori_Review_Windows.zip
          if-no-files-found: error
          retention-days: 14
